[package]
name = "battery-tray"
version.workspace = true
edition.workspace = true

[[bin]]
name = "battery-tray"
path = "src/main.rs"

[build-dependencies]
battery-core = { path = "../battery-core" }
embed-resource = "3"

[dependencies]
battery-core = { path = "../battery-core" }
battery-win = { path = "../battery-win" }

[dependencies.windows-sys]
version = "0.60"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
]
