[workspace]
resolver = "2"
members = ["crates/battery-core", "crates/battery-win", "crates/battery-tray"]
exclude = ["probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Antoinenz/battery-tray"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
