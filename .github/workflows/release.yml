name: Release

# Tagging is the release. Pushing v1.2.3 builds that commit, names the binary
# after the tag, and publishes it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # What build.rs reads to make this a release build rather than a dev one.
      # Set for the whole job so the tests and the shipped binary are built
      # from an identical configuration.
      BATTERY_TRAY_RELEASE: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo --version

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release

      # build.rs cannot fail the build when the SDK resource compiler is
      # missing -- the app still runs, it just loses its icon and version
      # block. That would ship a nameless binary silently, so check the tag
      # actually made it into the executable before publishing anything.
      - name: Verify the binary carries the tag
        shell: pwsh
        run: |
          $exe = "target/release/battery-tray.exe"
          $info = (Get-Item $exe).VersionInfo
          "FileVersion:  $($info.FileVersion)"
          "ProductName:  $($info.ProductName)"
          if ($info.FileVersion -ne "${{ github.ref_name }}") {
            throw "expected version '${{ github.ref_name }}', got '$($info.FileVersion)' -- resources were probably not embedded"
          }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash target/release/battery-tray.exe -Algorithm SHA256).Hash.ToLower()
          "$h  battery-tray.exe" | Out-File -Encoding ascii target/release/battery-tray.exe.sha256
          Get-Content target/release/battery-tray.exe.sha256

      # Notes come from the tag's own section of CHANGELOG.md when it has one.
      # A release describing what changed is worth writing by hand; the commit
      # list GitHub generates is a poor substitute, so fall back to it only
      # when the changelog has nothing to say about this tag.
      - name: Release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^##\s+$([regex]::Escape($tag))\s*$").LineNumber
          if (-not $start) {
            "No CHANGELOG.md section for $tag; falling back to generated notes."
            "file=" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            exit 0
          }
          # From just after the heading to the line before the next one.
          $rest = $lines[$start..($lines.Count - 1)]
          $next = ($rest | Select-String -Pattern "^##\s").LineNumber | Select-Object -First 1
          if ($next -gt 1) { $rest = $rest[0..($next - 2)] }
          ($rest -join "`n").Trim() | Out-File -Encoding utf8 notes.md
          Get-Content notes.md
          "file=notes.md" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = if ("${{ steps.notes.outputs.file }}") {
            @("--notes-file", "${{ steps.notes.outputs.file }}")
          } else {
            @("--generate-notes")
          }
          gh release create "${{ github.ref_name }}" `
            target/release/battery-tray.exe `
            target/release/battery-tray.exe.sha256 `
            --title "BatteryTray ${{ github.ref_name }}" `
            @notes
